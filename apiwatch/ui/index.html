<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>api-watch - Live Logs</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <!-- Login Page -->
    <div id="login-page" class="login-container">
      <div class="login-box">
        <h2>api-watch</h2>
        <form id="login-form" onsubmit="login(event)">
          <input
            type="text"
            id="username"
            class="login-input"
            placeholder="Username"
            required
            autocomplete="username"
          />
          <input
            type="password"
            id="password"
            class="login-input"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <button type="submit" class="login-btn" id="login-btn">Login</button>
        </form>
        <div id="login-error" class="error hidden">Invalid credentials</div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="header">
        <div class="header-left">
          <h1>api-watch</h1>
          <div class="status">
            <div class="status-dot"></div>
            <span>Live</span>
            <span>|</span>
            <span id="request-count">0 logs</span>
          </div>
        </div>
        <div class="header-right">
          <div class="theme-toggle" onclick="toggleTheme()">
            <div class="theme-toggle-slider"></div>
          </div>
          <button class="btn" onclick="clearRequests()">Clear</button>
          <button class="btn" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="container">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Logs</div>
            <div class="stat-value" id="total-requests">0</div>
            <div class="stat-chart" id="chart-total"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Error Rate</div>
            <div class="stat-value" id="error-rate">0%</div>
            <div class="stat-chart" id="chart-error"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Containers</div>
            <div class="stat-value" id="active-containers">0</div>
          </div>
        </div>

        <div class="controls">
          <div class="control-group">
            <span class="control-label">Level:</span>
            <select class="select" id="filter-level" onchange="applyFilters()">
              <option value="all">All</option>
              <option value="CRITICAL">Critical</option>
              <option value="ERROR">Error</option>
              <option value="WARNING">Warning</option>
              <option value="INFO">Info</option>
              <option value="DEBUG">Debug</option>
              <option value="UNKNOWN">Unknown</option>
            </select>
          </div>

          <div class="control-group">
            <span class="control-label">Container:</span>
            <select class="select" id="filter-container" onchange="applyFilters()">
              <option value="all">All</option>
            </select>
          </div>

          <div class="control-group">
            <span class="control-label">Sort By:</span>
            <select class="select" id="sort-by" onchange="applySort()">
              <option value="time-desc">Newest First</option>
              <option value="time-asc">Oldest First</option>
              <option value="level-desc">Severity (Worst First)</option>
              <option value="level-asc">Severity (Best First)</option>
            </select>
          </div>
        </div>

        <div id="requests"></div>
        <div id="empty-state" class="empty-state">
          <p>Waiting for container logs...</p>
          <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <div class="pagination">
        <button id="prev-page" class="btn" onclick="prevPage()">Prev</button>
        <span id="page-num">1</span>
        <button id="next-page" class="btn" onclick="nextPage()">Next</button>
      </div>

      <div class="footer">
        <span>&copy; Isaac Kyalo</span> |
        <a
          class="link"
          href="https://github.com/mount-isaac/api-watch"
          target="_blank"
          >GitHub</a
        >
      </div>
    </div>

    <script src="/static/scripts.js"></script>
  </body>
</html>
